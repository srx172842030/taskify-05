server:
  port: 8082

spring:
  application:
    name: taskify-example
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR}
  datasource:
    url: jdbc:postgresql://${POSTGRES_ADDR}/taskify
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_example

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{requestId:-}] %logger{36} - %msg%n"

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

rocketmq:
  name-server: ${ROCKETMQ_ADDR}
  producer:
    group: taskify-producer-group

taskify:
  rocketmq:
    enabled: true
