server:
  port: 8081

spring:
  application:
    name: taskify-auth
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR}
  datasource:
    url: jdbc:postgresql://${POSTGRES_ADDR}/taskify
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_auth

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{requestId:-}] %logger{36} - %msg%n"

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

taskify:
  jwt:
    secret: ${JWT_SECRET}
    ttl-hours: 24
  captcha:
    enabled: false
