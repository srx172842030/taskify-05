server:
  port: 8081

spring:
  application:
    name: taskify-auth
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
  datasource:
    url: jdbc:postgresql://${POSTGRES_ADDR:localhost:5432}/taskify
    username: ${POSTGRES_USER:taskify}
    password: ${POSTGRES_PASSWORD:taskify}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_auth

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{requestId:-}] %logger{36} - %msg%n"

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

taskify:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-please-use-a-long-random-string}
    ttl-hours: 24
  captcha:
    enabled: false
