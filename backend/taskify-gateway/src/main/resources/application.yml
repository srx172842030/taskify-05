server:
  port: 8080

spring:
  application:
    name: taskify-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR}
    gateway:
      server:
        webflux:
          routes:
            - id: auth
              uri: lb://taskify-auth
              predicates:
                - Path=/api/v1/auth/**
            - id: example
              uri: lb://taskify-example
              predicates:
                - Path=/api/v1/examples/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - "${CORS_ORIGIN}"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                allowed-headers: "*"

taskify:
  jwt:
    secret: ${JWT_SECRET}
