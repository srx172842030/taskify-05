name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端矩阵构建
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [taskify-common, taskify-gateway, taskify-auth, taskify-example, taskify-project, taskify-notification]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 构建 ${{ matrix.module }}
        working-directory: backend
        run: mvn -q -pl ${{ matrix.module }} -am test

  frontend:
    name: 前端构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: 安装依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: 单元测试
        working-directory: frontend
        run: pnpm test
      - name: 构建
        working-directory: frontend
        run: pnpm build
